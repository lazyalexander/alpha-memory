[package]
name = "alpha-memory"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Session memory engine for coding-agent harnesses"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
rusqlite = { version = "0.36", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
